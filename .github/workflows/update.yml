name: Check for upstream update

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check latest upstream release
        id: check_release
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/Lemonochka/keqdroid/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          NEW_VER="${LATEST_TAG#v}"
          
          CURRENT_VER=$(grep '^pkgver=' PKGBUILD | cut -d'=' -f2)
          
          echo "Current: $CURRENT_VER, Upstream: $NEW_VER"
          echo "new_ver=$NEW_VER" >> $GITHUB_OUTPUT
          echo "current_ver=$CURRENT_VER" >> $GITHUB_OUTPUT

      - name: Update files and push
        if: steps.check_release.outputs.new_ver != steps.check_release.outputs.current_ver && steps.check_release.outputs.new_ver != ''
        env:
          NEW_VER: ${{ steps.check_release.outputs.new_ver }}
        run: |
          DEB_URL="https://github.com/Lemonochka/keqdroid/releases/download/v${NEW_VER}/keqdroid_${NEW_VER}_amd64.deb"
          curl -sL -o package.deb "$DEB_URL"
          NEW_SHA256=$(sha256sum package.deb | awk '{print $1}')
          rm package.deb

          sed -i "s/^pkgver=.*/pkgver=${NEW_VER}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${NEW_SHA256}')/" PKGBUILD

          sed -i "s/pkgver = .*/pkgver = ${NEW_VER}/" .SRCINFO
          sed -i "s/pkgrel = .*/pkgrel = 1/" .SRCINFO
          sed -i "s/sha256sums = .*/sha256sums = ${NEW_SHA256}/" .SRCINFO

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "chore(auto): bump version to ${NEW_VER}"
          git push
